kind: rule
id: place-influence
system: agentlife.world
triggers:
  - agentlife.world/influence-accepted
inputs:
  - name: kind
    state: agentlife.world/influence.kind
  - name: role
    state: agentlife.world/participation.role
  - name: accepted
    state: agentlife.world/influence.accepted
  - name: value
    state: agentlife.world/influence.destination
condition:
  op: all
  operands:
    - op: compare
      left:
        kind: read
        name: kind
      right:
        kind: literal
        value: agentlife.demo/put-on
      operator: eq
    - op: compare
      left:
        kind: read
        name: role
      right:
        kind: literal
        value: subject
      operator: eq
    - op: compare
      left:
        kind: read
        name: accepted
      right:
        kind: literal
        value: true
      operator: eq
changes:
  - state: agentlife.world/placed-on
    combine: priority
    priority: 1
    value:
      kind: read
      name: value
