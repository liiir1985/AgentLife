kind: rule
id: load-move-cost-factor
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: load
    state: agentlife.body/values.load
condition:
  op: always
changes:
  - state: agentlife.body/values.move-cost-factor
    combine: multiply
    value:
      kind: map
      input:
        kind: read
        name: load
      mapping:
        kind: threshold
        inputUnit: mass
        at: 10
        boundary: lower
        below: 1
        above: 1.2
        policy:
          unit: ratio
          rounding:
            mode: half-away-from-zero
            precision: 2
          range:
            min: 0.25
            max: 4
            boundary: inclusive
          overflow: saturate
