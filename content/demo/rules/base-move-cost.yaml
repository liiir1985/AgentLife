kind: rule
id: base-move-cost
domain: agentlife.body/extension
triggers:
  - agentlife.body/value-changed
reads:
  - alias: load
    view: agentlife.body/values
    field: load
condition:
  op: always
effects:
  - target: agentlife.body/values.move-cost
    composition: add
    value:
      kind: map
      input:
        kind: read
        alias: load
      mapping:
        kind: piecewise-linear
        inputUnit: mass
        points:
          - x: 0
            y: 2
          - x: 10
            y: 5
          - x: 30
            y: 12
        outOfRange:
          kind: clamp
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 2
          range:
            min: 0
            max: 50
            boundary: inclusive
          overflow: reject
