kind: rule
id: base-move-cost
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: load
    state: agentlife.body/values.load
condition:
  op: always
changes:
  - state: agentlife.body/values.move-cost
    combine: add
    value:
      kind: map
      input:
        kind: read
        name: load
      mapping:
        kind: piecewise-linear
        inputUnit: mass
        points:
          - x: 0
            y: 2
          - x: 10
            y: 5
          - x: 30
            y: 12
        outOfRange:
          kind: clamp
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 2
          range:
            min: 0
            max: 50
            boundary: inclusive
          overflow: reject
