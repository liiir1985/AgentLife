# 累了就歇一会：体力掉到 60 以下时建立恢复过程。
#
# 条件里没有环境。原先这里还要求「环境光 > 10 lux」——那是把光线接进体力的另一条
# 支路，而光线只该走视觉；在暗处躺着也是休息，亮不亮和恢复快慢无关。
kind: rule
id: recovery-request
system: agentlife.body
triggers:
  - agentlife.body/tick-elapsed
inputs:
  - name: stamina
    state: agentlife.body/values.stamina
condition:
  op: all
  operands:
    - op: simulation-time
      operator: at-or-after
      tick: 1
    - op: compare
      left:
        kind: read
        name: stamina
      right:
        kind: literal
        value: 60
        unit: points
      operator: lt
changes:
  - processRef: agentlife.body/recovery
    action: establish
    params:
      rate:
        kind: literal
        value: 5
        unit: points
