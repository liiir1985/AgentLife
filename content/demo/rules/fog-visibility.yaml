kind: rule
id: fog-visibility
system: agentlife.world
triggers:
  - agentlife.world/environment-changed
inputs:
  - name: fog
    state: agentlife.world/environment.fog-density
condition:
  op: compare
  left:
    kind: read
    name: fog
  right:
    kind: literal
    value: 0
    unit: ratio
  operator: gt
changes:
  - state: agentlife.world/environment.visibility
    combine: min
    value:
      kind: map
      input:
        kind: read
        name: fog
      mapping:
        kind: piecewise-constant
        inputUnit: ratio
        bands:
          - from: null
            value: 1
          - from: 0.4
            value: 0.5
          - from: 0.8
            value: 0.15
        outOfRange:
          kind: clamp
        policy:
          unit: ratio
          rounding:
            mode: half-away-from-zero
            precision: 3
          range:
            min: 0
            max: 1
            boundary: inclusive
          overflow: saturate
