kind: rule
id: cognitive-participation
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: wakefulness
    state: agentlife.body/values.wakefulness
condition:
  op: always
changes:
  - state: agentlife.body/cognitive-participation
    combine: priority
    priority: 1
    value:
      kind: select
      left:
        kind: read
        name: wakefulness
      right:
        kind: literal
        value: 20
        unit: points
      operator: lt
      then:
        kind: literal
        value: forbidden
      otherwise:
        kind: select
        left:
          kind: read
          name: wakefulness
        right:
          kind: literal
          value: 60
          unit: points
        operator: lt
        then:
          kind: literal
          value: restricted
        otherwise:
          kind: literal
          value: allowed
