kind: rule
id: vision-efficiency
system: agentlife.body
triggers:
  - agentlife.world/environment-changed
inputs:
  - name: light
    state: agentlife.world/environment.light-level
  - name: fog
    state: agentlife.world/environment.fog-density
condition:
  op: always
changes:
  - state: agentlife.body/channels.vision.efficiency
    combine: priority
    priority: 1
    value:
      kind: combine
      method: min
      operands:
        - kind: map
          input:
            kind: read
            name: light
          mapping:
            kind: piecewise-linear
            inputUnit: lux
            points:
              - x: 0
                y: 0
              - x: 50
                y: 0.35
              - x: 500
                y: 1
            outOfRange:
              kind: clamp
            policy:
              unit: ratio
              rounding:
                mode: half-away-from-zero
                precision: 3
              range:
                min: 0
                max: 1
                boundary: inclusive
              overflow: saturate
        - kind: map
          input:
            kind: read
            name: fog
          mapping:
            kind: piecewise-constant
            inputUnit: ratio
            bands:
              - from: null
                value: 1
              - from: 0.4
                value: 0.6
              - from: 0.8
                value: 0.2
            outOfRange:
              kind: clamp
            policy:
              unit: ratio
              rounding:
                mode: half-away-from-zero
                precision: 3
              range:
                min: 0
                max: 1
                boundary: inclusive
              overflow: saturate
