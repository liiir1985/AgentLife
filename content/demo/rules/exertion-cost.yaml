kind: rule
id: exertion-cost
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: intensity
    state: agentlife.world/environment.slope
  - name: stamina
    state: agentlife.body/values.stamina
condition:
  op: all
  operands:
    - op: compare
      left:
        kind: read
        name: intensity
      right:
        kind: literal
        value: 0
        unit: ratio
      operator: gt
    - op: compare
      left:
        kind: read
        name: stamina
      right:
        kind: literal
        value: 0
        unit: points
      operator: gt
changes:
  - state: agentlife.body/values.stamina
    combine: add
    value:
      kind: map
      input:
        kind: read
        name: intensity
      mapping:
        kind: piecewise-linear
        inputUnit: ratio
        points:
          - x: 0
            y: 0
          - x: 0.25
            y: -2
          - x: 1
            y: -12
        outOfRange:
          kind: clamp
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 1
          range:
            min: -20
            max: 0
            boundary: inclusive
          overflow: saturate
