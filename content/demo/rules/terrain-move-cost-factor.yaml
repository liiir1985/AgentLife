kind: rule
id: terrain-move-cost-factor
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: slope
    state: agentlife.world/environment.slope
condition:
  op: always
changes:
  - state: agentlife.body/values.move-cost-factor
    combine: multiply
    value:
      kind: map
      input:
        kind: read
        name: slope
      mapping:
        kind: piecewise-constant
        inputUnit: ratio
        bands:
          - from: null
            value: 1
          - from: 0.2
            value: 1.4
          - from: 0.6
            value: 2
        outOfRange:
          kind: clamp
        policy:
          unit: ratio
          rounding:
            mode: half-away-from-zero
            precision: 2
          range:
            min: 0.25
            max: 4
            boundary: inclusive
          overflow: saturate
