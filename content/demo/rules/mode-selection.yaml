# 身体能力随体力降级：累到走不动、拿不稳的时候换到困倦模式，只剩说话和手势。
#
# 降级线取 40，和护卫巡逻树里「体力见底就先歇着」用同一个数：树不去做的动作，
# 身体也不允许做，两边说的是同一件事——护卫不会一直拿一个必败的计划去撞身体。
kind: rule
id: mode-selection
system: agentlife.body
triggers:
  - agentlife.body/value-changed
inputs:
  - name: stamina
    state: agentlife.body/values.stamina
condition:
  op: always
changes:
  - state: agentlife.body/current-mode
    combine: priority
    priority: 1
    value:
      kind: select
      left:
        kind: read
        name: stamina
      right:
        kind: literal
        value: 40
        unit: points
      operator: lt
      then:
        kind: literal
        value: agentlife.demo/drowsy
      otherwise:
        kind: literal
        value: agentlife.demo/awake
