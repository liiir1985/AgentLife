kind: rule
id: rest-recovery
system: agentlife.body
triggers:
  - agentlife.body/tick-elapsed
inputs:
  - name: stamina
    state: agentlife.body/values.stamina
  - name: light
    state: agentlife.world/environment.light-level
condition:
  op: all
  operands:
    - op: simulation-time
      operator: at-or-after
      tick: 1
    - op: within
      value:
        kind: read
        name: stamina
      min: 0
      max: 60
      boundary: exclusive
    - op: compare
      left:
        kind: read
        name: light
      right:
        kind: literal
        value: 10
        unit: lux
      operator: gt
changes:
  - state: agentlife.body/values.stamina
    combine: add
    value:
      kind: map
      input:
        kind: read
        name: stamina
      mapping:
        kind: threshold
        inputUnit: points
        at: 30
        boundary: lower
        below: 5
        above: 1
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 1
          range:
            min: 0
            max: 10
            boundary: inclusive
          overflow: saturate
