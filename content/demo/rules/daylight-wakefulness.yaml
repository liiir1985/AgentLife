kind: rule
id: daylight-wakefulness
system: agentlife.body
triggers:
  - agentlife.body/tick-elapsed
inputs:
  - name: angle
    state: agentlife.world/environment.sun-angle
condition:
  op: simulation-time
  operator: at-or-after
  tick: 1
changes:
  - state: agentlife.body/values.wakefulness
    combine: priority
    priority: 10
    value:
      kind: map
      input:
        kind: read
        name: angle
      mapping:
        kind: piecewise-constant
        inputUnit: degrees
        bands:
          - from: null
            value: 0
          - from: 60
            value: 40
          - from: 120
            value: 80
        outOfRange:
          kind: clamp
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 0
          range:
            min: 0
            max: 100
            boundary: inclusive
          overflow: saturate
