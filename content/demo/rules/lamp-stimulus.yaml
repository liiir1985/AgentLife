kind: rule
id: lamp-stimulus
system: agentlife.body
triggers:
  - agentlife.body/tick-elapsed
inputs:
  - name: lamp
    state: agentlife.world/environment.lamp-state
condition:
  op: compare
  left:
    kind: read
    name: lamp
  right:
    kind: literal
    value: 1
    unit: state
  operator: eq
changes:
  - state: agentlife.body/values.wakefulness
    combine: priority
    priority: 5
    value:
      kind: map
      input:
        kind: read
        name: lamp
      mapping:
        kind: threshold
        inputUnit: state
        at: 1
        boundary: lower
        below: 0
        above: 20
        policy:
          unit: points
          rounding:
            mode: half-away-from-zero
            precision: 0
          range:
            min: 0
            max: 100
            boundary: inclusive
          overflow: saturate
