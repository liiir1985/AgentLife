kind: rule
id: darkness-visibility
system: agentlife.world
triggers:
  - agentlife.world/environment-changed
inputs:
  - name: light
    state: agentlife.world/environment.light-level
condition:
  op: always
changes:
  - state: agentlife.world/environment.visibility
    combine: min
    value:
      kind: map
      input:
        kind: read
        name: light
      mapping:
        kind: piecewise-linear
        inputUnit: lux
        points:
          - x: 0
            y: 0
          - x: 50
            y: 0.3
          - x: 500
            y: 1
        outOfRange:
          kind: clamp
        policy:
          unit: ratio
          rounding:
            mode: half-away-from-zero
            precision: 3
          range:
            min: 0
            max: 1
            boundary: inclusive
          overflow: saturate
