kind: rule
id: vision-availability
system: agentlife.body
triggers:
  - agentlife.world/environment-changed
inputs:
  - name: fog
    state: agentlife.world/environment.fog-density
condition:
  op: always
changes:
  - state: agentlife.body/channels.vision.available
    combine: priority
    priority: 1
    value:
      kind: select
      left:
        kind: read
        name: fog
      right:
        kind: literal
        value: 0.9
        unit: ratio
      operator: gt
      then:
        kind: literal
        value: false
      otherwise:
        kind: literal
        value: true
